name: 'aod-handle'
# Current workflow requires the triggering event must be pull_request_review as
# it relies on this event to get the approval submit time as IAM permission
# expiration start time.
on:
  workflow_call:
    inputs:
      workload_identity_provider:
        description: 'The full identifier of the Workload Identity Provider, including the project number, pool name, and provider name.'
        type: 'string'
        required: true
      service_account:
        description: 'Email address or unique identifier of the Google Cloud service account for which to generate credentials.'
        type: 'string'
        required: true
      aod_cli_version:
        description: 'The version of AOD CLI, without the "v" prefix, e.g. "0.1.2".'
        type: 'string'
        required: true
      go_version:
        description: 'The version of Golang.'
        type: 'string'
        default: '1.21'
        required: false
      tagrep_version:
        description: 'The version of tagrep to use.'
        type: 'string'
        default: '0.0.6'
        required: false

env:
  DEFAULT_DURATION: '2h'
  IAM_ERROR_FILENAME: '/tmp/iam_error.txt'
  IAM_OUT_FILENAME: '/tmp/iam_output.txt'
  TOOL_ERROR_FILENAME: '/tmp/tool_error.txt'
  TOOL_OUT_FILENAME: '/tmp/tool_output.txt'

jobs:
  review_status:
    runs-on: 'ubuntu-latest'
    permissions:
      pull-requests: 'read'
    outputs:
      REVIEW_DECISION: '${{ steps.get_breakglass_decision.outputs.REVIEW_DECISION || steps.get_review_decision.outputs.REVIEW_DECISION }}'
    steps:
      - id: 'get_breakglass_decision'
        if: |-
          github.event.pull_request.state == 'open' &&
          contains(github.event.pull_request.labels.*.name, 'aod-breakglass')
        run: |
          echo "REVIEW_DECISION=BREAKGLASS" >> "${GITHUB_OUTPUT}"

      - id: 'get_review_decision'
        if: |-
          github.event.pull_request.state == 'open' &&
          !contains(github.event.pull_request.labels.*.name, 'aod-breakglass')
        env:
          # Set the GH_TOKEN environment variable to use GitHub CLI in a GitHub Actions workflow.
          # See ref: https://docs.github.com/en/actions/using-workflows/using-github-cli-in-workflows
          GH_TOKEN: '${{ github.token }}'
          REPO: '${{ github.repository }}'
          REPO_OWNER: '${{ github.repository_owner }}'
          PR_NUMBER: '${{ github.event.pull_request.number }}'
        shell: 'bash'
        run: |
          set -euo pipefail
          if [[ ! "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "::warning::Invalid pull request number '${PR_NUMBER}'"
            echo "REVIEW_DECISION=REVIEW_REQUIRED" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          pr_json="$(gh api graphql \
            -F owner="${REPO_OWNER}" \
            -F name="${REPO##*/}" \
            -F pr_number="${PR_NUMBER}" \
            -f query='
              query($name: String!, $owner: String!, $pr_number: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $pr_number) {
                    state
                    reviewDecision
                  }
                }
              }
            ')"

          pr_state="$(printf '%s' "${pr_json}" | jq -r '.data.repository.pullRequest.state // ""')"
          if [[ "${pr_state}" != "OPEN" ]]; then
            echo "::warning::Refusing to handle non-open pull request #${PR_NUMBER} (state=${pr_state})"
            echo "REVIEW_DECISION=CLOSED" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          review_decision="$(printf '%s' "${pr_json}" | jq -r '.data.repository.pullRequest.reviewDecision // ""')"
          echo "REVIEW_DECISION=${review_decision}" >> "${GITHUB_OUTPUT}"

  handle:
    # Only handle the request when the PR is open and approved by qualified approvers.
    needs: 'review_status'
    if: |-
      ${{
        github.event.pull_request.state == 'open' && (
          needs.review_status.outputs.REVIEW_DECISION == 'BREAKGLASS' ||
          (needs.review_status.outputs.REVIEW_DECISION == 'APPROVED' && github.event.review.state == 'approved')
        )
      }}
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
      id-token: 'write'
      pull-requests: 'write'
    name: 'Handle Request'
    steps:
      - name: 'Validate inputs'
        shell: 'bash'
        env:
          AOD_CLI_VERSION: '${{ inputs.aod_cli_version }}'
          TAGREP_VERSION: '${{ inputs.tagrep_version }}'
          GO_VERSION: '${{ inputs.go_version }}'
        run: |
          if [[ ! "${AOD_CLI_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$ ]]; then
            echo "::error::Invalid aod_cli_version '${AOD_CLI_VERSION}'"
            exit 1
          fi
          if [[ ! "${TAGREP_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$ ]]; then
            echo "::error::Invalid tagrep_version '${TAGREP_VERSION}'"
            exit 1
          fi
          if [[ ! "${GO_VERSION}" =~ ^[0-9]+\.[0-9]+(\.[0-9x]+)?$ ]]; then
            echo "::error::Invalid go_version '${GO_VERSION}'"
            exit 1
          fi

      - name: 'Checkout Triggering Branch'
        uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # ratchet:actions/checkout@v4
        with:
          ref: '${{ github.event.pull_request.head.sha }}'

      # Steps will be skipped starting from here when iam.yaml file does not
      # exist in the case of a pull_request_review event.
      - name: 'Setup Go'
        if: |-
          ${{ hashFiles('iam.yaml', 'tool.yaml') != '' }}
        uses: 'actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b' # ratchet:actions/setup-go@v5
        with:
          go-version: '${{ inputs.go_version }}'

      - name: 'Authenticate to Google Cloud'
        if: |-
          ${{ hashFiles('iam.yaml', 'tool.yaml') != '' }}
        uses: 'google-github-actions/auth@6fc4af4b145ae7821d527454aa9bd537d1f2dc5f' # ratchet:google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ inputs.workload_identity_provider }}'
          service_account: '${{ inputs.service_account }}'
          token_format: 'access_token'

      # Install gcloud, `setup-gcloud` automatically picks up authentication from `auth`.
      - name: 'Set up Cloud SDK'
        if: |-
          ${{ hashFiles('tool.yaml') != '' }}
        uses: 'google-github-actions/setup-gcloud@6189d56e4096ee891640bb02ac264be376592d6a' # ratchet:google-github-actions/setup-gcloud@v2

      - name: 'Setup AOD'
        if: |-
          ${{ hashFiles('iam.yaml', 'tool.yaml') != '' }}
        uses: 'abcxyz/actions/.github/actions/setup-binary@f6b4a8b9931cfcad89e92cda689f548a133428cb' # ratchet:abcxyz/actions/.github/actions/setup-binary@main
        with:
          download_url: 'https://github.com/abcxyz/access-on-demand/releases/download/v${{ inputs.aod_cli_version }}/aod_${{ inputs.aod_cli_version }}_linux_amd64.tar.gz'
          install_path: '${{ runner.temp }}/.aod'
          # SECURITY: Do NOT cache this binary. The Actions cache for a PR ref
          # is writable by unapproved `pull_request` runs and is restored here
          # *after* WIF authentication without any integrity check, allowing a
          # poisoned `aod` to execute with the IAM-admin access token. The
          # release tarball is small; always download fresh.
          cache_key: ''
          add_to_path: true
          binary_subpath: 'aod'

      - name: 'Setup Tagrep'
        if: |-
          ${{ hashFiles('iam.yaml') != '' }}
        uses: 'abcxyz/actions/.github/actions/setup-binary@f6b4a8b9931cfcad89e92cda689f548a133428cb' # ratchet:abcxyz/actions/.github/actions/setup-binary@main
        with:
          download_url: 'https://github.com/abcxyz/tagrep/releases/download/v${{ inputs.tagrep_version }}/tagrep_${{ inputs.tagrep_version }}_linux_amd64.tar.gz'
          install_path: '${{ runner.temp }}/.tagrep'
          binary_subpath: 'tagrep'
          # SECURITY: Do NOT cache this binary; see the note on `Setup AOD`
          # above. `tagrep` also runs after WIF auth with the access token in
          # the environment.
          cache_key: ''
          add_to_path: true

      # Duration labels need to be prefixed with "duration-", an example is "duration-2h".
      - name: 'Get Duration From Label'
        if: |-
          ${{ hashFiles('iam.yaml') != '' }}
        shell: 'bash'
        env:
          LABEL_NAMES: '${{ toJson(github.event.pull_request.labels.*.name) }}'
        run: |
          while IFS= read -r name; do
            if [[ "${name}" == duration-* ]]; then
              part2="${name#duration-}"
              if [[ "${part2}" =~ ^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$ ]]; then
                echo "LABELED_DURATION=${part2}" >> "${GITHUB_ENV}"
              else
                echo "::warning::Ignoring invalid duration label '${name}'"
              fi
              break
            fi
          done < <(printf '%s' "${LABEL_NAMES}" | jq -r '.[]')

      - name: 'Tagrep PR vars'
        if: |-
          ${{ hashFiles('iam.yaml') != '' }}
        shell: 'bash'
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          TAGREP_LOG_TARGET: 'STDERR'
        run: |
          tags="$(tagrep parse -type=request -format=raw 2> tagrep.log)"
          cat tagrep.log
          echo "tags -> ${tags}"
          # Only accept the AOD_DURATION key and only when its value is a valid
          # Go duration (e.g. "2h", "30m", "1h30m"); reject anything else so that
          # arbitrary tagrep output cannot set unrelated env vars or carry
          # shell metacharacters into later steps.
          aod_duration="$(printf '%s\n' "${tags}" | grep -E '^AOD_DURATION=' | head -n 1 | cut -d= -f2- | grep -E '^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$' || true)"
          if [[ -n "${aod_duration}" ]]; then
            echo "AOD_DURATION=${aod_duration}" >> "${GITHUB_ENV}"
          fi

      # Request will not be handled when iam.yaml file is not found.
      - name: 'Handle IAM Request'
        if: |-
          ${{ hashFiles('iam.yaml') != '' }}
        id: 'handle_iam'
        env:
          DURATION: '${{ env.AOD_DURATION || env.LABELED_DURATION || env.DEFAULT_DURATION }}'
          IAM_FILE_PATH: '${{ github.workspace }}/iam.yaml'
          START_TIME: '${{ github.event.review.submitted_at || github.event.pull_request.updated_at }}'
        run: |
          touch "${IAM_ERROR_FILENAME}" "${IAM_OUT_FILENAME}"
          aod iam handle \
            -path "${IAM_FILE_PATH}" \
            -duration "${DURATION}" \
            -start-time "${START_TIME}" \
            2> >(tee "${IAM_ERROR_FILENAME}" >&2) \
            1> >(tee "${IAM_OUT_FILENAME}")

      # Request will not be handled when tool.yaml file does not exist in the
      # case of a pull_request_review event, instead it prints out a notice.
      - name: 'Handle Tool Request'
        if: |-
          ${{ hashFiles('tool.yaml') != '' }}
        id: 'handle_tool'
        env:
          TOOL_FILE_PATH: '${{ github.workspace }}/tool.yaml'
        run: |
          touch "${TOOL_ERROR_FILENAME}" "${TOOL_OUT_FILENAME}"
          # shellcheck disable=SC1010
          aod tool do -path "${TOOL_FILE_PATH}" \
            2> >(tee "${TOOL_ERROR_FILENAME}" >&2) \
            1> >(tee "${TOOL_OUT_FILENAME}")

      - name: 'IAM Request Comment'
        if: |-
          ${{ always() && hashFiles('iam.yaml') != '' }}
        uses: 'actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea' # ratchet:actions/github-script@v7
        env:
          DURATION: '${{ env.AOD_DURATION || env.LABELED_DURATION || env.DEFAULT_DURATION }}'
          OUTCOME: '${{ steps.handle_iam.outcome }}'
          PR_NUMBER: '${{ github.event.pull_request.number }}'
        with:
          github-token: '${{ github.token }}'
          retries: '3'
          script: |+
            var body, req;
            const fs = require("fs");
            const outcome = process.env.OUTCOME;
            switch (outcome) {
              case 'success':
                req = fs.readFileSync(
                  process.env.IAM_OUT_FILENAME,
                  { encoding: "utf8" }
                );

                body = `**\`Access on Demand\`** - 🟩 **\`IAM\`** request succeeded.

            <details>
            <summary>Details</summary>
            Added below IAM permissions, and they will be expired in ${process.env.DURATION}.

            \`\`\`
            ${req}
            \`\`\`
            </details>`;
                break;
              case 'failure':
                req = fs.readFileSync(
                  process.env.IAM_OUT_FILENAME,
                  { encoding: "utf8" }
                );
                const error = fs.readFileSync(
                  process.env.IAM_ERROR_FILENAME,
                  { encoding: "utf8" }
                );
                body = `**\`Access on Demand\`** - 🟥 **\`IAM\`** request failed.

            <details>
            <summary>Details</summary>
            Failed to added below IAM permissions.

            \`\`\`
            ${req}
            \`\`\`

            Error:
            \`\`\`
            ${error}
            \`\`\`
            </details>`;
                break;
              // step cancelled.
              default:
                // Do nothing.
                break;
            }

            if (typeof body !== "undefined") {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(process.env.PR_NUMBER),
                body: body,
              });
            }

      - name: 'Tool Request Comment'
        if: |-
          ${{ always() && hashFiles('tool.yaml') != '' }}
        uses: 'actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea' # ratchet:actions/github-script@v7
        env:
          OUTCOME: '${{ steps.handle_tool.outcome }}'
          PR_NUMBER: '${{ github.event.pull_request.number }}'
        with:
          github-token: '${{ github.token }}'
          retries: '3'
          script: |+
            var body, req;
            const fs = require("fs");
            const outcome = process.env.OUTCOME;
            switch (outcome) {
              case 'success':
                req = fs.readFileSync(
                  process.env.TOOL_OUT_FILENAME,
                  { encoding: "utf8" }
                );

                body = `**\`Access on Demand\`** - 🟩 **\`Tool\`** request succeeded.

            <details>
            <summary>Details</summary>
            Executed "do" commands in the request below.

            \`\`\`
            ${req}
            \`\`\`
            </details>`;
                break;
              case 'failure':
                req = fs.readFileSync(
                  process.env.TOOL_OUT_FILENAME,
                  { encoding: "utf8" }
                );
                const error = fs.readFileSync(
                  process.env.TOOL_ERROR_FILENAME,
                  { encoding: "utf8" }
                );
                body = `**\`Access on Demand\`** - 🟥 **\`Tool\`** request failed.

            <details>
            <summary>Details</summary>
            Failed to execute "do" commands in the request below.

            \`\`\`
            ${req}
            \`\`\`

            Error:
            \`\`\`
            ${error}
            \`\`\`
            </details>`;
                break;
              // step cancelled.
              default:
                // Do nothing.
                break;
            }

            if (typeof body !== "undefined") {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(process.env.PR_NUMBER),
                body: body,
              });
            }

      - name: 'Request Not Found Comment'
        if: |-
          ${{ always() && hashFiles('iam.yaml', 'tool.yaml') == '' }}
        uses: 'actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea' # ratchet:actions/github-script@v7
        env:
          PR_NUMBER: '${{ github.event.pull_request.number }}'
        with:
          github-token: '${{ github.token }}'
          retries: '3'
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: `**\`Access on Demand\`** - 🟦 request not found.
            - To require IAM permission on demand, add an **\`iam.yaml\`** file at repo root.
            - To run tool commands on demand, add an **\`tool.yaml\`** file at repo root.`,
            });
